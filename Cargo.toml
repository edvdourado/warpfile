[package]
name = "warpfile"
version = "0.1.0-alpha.2"
edition = "2024"

[dependencies]
blake3 = "1.8.7"
getrandom = "0.4.3"
if-addrs = "0.15.0"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[dev-dependencies]
cpu-time = "1.0.0"
proc-memstat = "0.1.0"
tempfile = "3.27.0"
